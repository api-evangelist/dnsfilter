aid: dnsfilter
name: DNSFilter
description: >-
  DNSFilter is an AI-powered DNS security and content-filtering platform that
  protects organizations from cyber threats and unwanted content at the DNS
  layer. Its machine-learning engine blocks malicious domains — phishing,
  malware, ransomware, and botnet command-and-control — often before they
  appear in third-party threat feeds, and enforces content policies across 40+
  categories with application-level (AppAware) controls, roaming clients for
  off-network devices, and user-behavior analytics (CyberSight). DNSFilter
  serves SMBs, enterprises, MSPs, schools, healthcare, and government over a
  dual Anycast network with DNSSEC validation. The DNSFilter management REST API
  (api.dnsfilter.com) programmatically manages organizations, networks/sites,
  filtering policies, block pages, applications, categories, API keys, and
  traffic/threat reporting — authenticated with an API key in the Authorization
  header.
