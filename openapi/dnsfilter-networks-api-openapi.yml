components:
  schemas:
    Links:
      type: object
      properties:
        self:
          type: string
          description: Endpoint URL (may be null)
      description: JSON API links member representation
    IpAddress:
      type: object
      properties:
        ip:
          type: string
          description: IP
        address:
          type: string
          description: IP address
        network_id:
          type: integer
          description: Network ID
        organization_id:
          type: integer
          description: Organization ID
      description: IpAddress resource
    NetworkBulkDestroySpec:
      type: object
      properties:
        ids:
          type: string
          description: Comma delimited Network IDs or keyword 'all'
        organization_id:
          type: integer
          description: Organization ID. Required if ids is 'all'
      required:
      - ids
      description: Network bulk destroy request parameters
    Network:
      type: object
      properties:
        name:
          type: string
          description: Network name
        physical_address:
          type: string
          description: Network physical address (may be null)
        latitude:
          type: number
          format: double
          description: Network reported latitude
        longitude:
          type: number
          format: double
          description: Network reported longitude
        block_default_appearance:
          type: boolean
          description: Default page appearance for blocked pages
        block_org_name:
          type: string
          description: Blocked page organization name (may be null)
        block_email_addr:
          type: string
          description: Blocked page email address (may be null)
        block_logo_uuid:
          type: string
          description: Blocked page custom logo (may be null)
        allow_all_policies:
          type: boolean
          description: Allow all policies
        billing_per_user:
          type: boolean
          description: Network usage billing per user
        billing_user_count:
          type: integer
          description: User network usage count
        network_type_units:
          type: integer
          description: User network usage count
        block_page_id:
          type: integer
          description: Block page ID
        scheduled_policy_id:
          type: integer
          description: Scheduled policy ID
        secret_key:
          type: string
          description: Network secret key for user agents and LAN proxies
        deleted_at:
          type: string
          format: date
          description: Item deletion date (may be null)
        external_id:
          type: string
          description: A unique identifier for external integrations
        local_domains:
          type: array
          items:
            type: string
          description: Array of local domains or DNS suffixes that should bypass filtering
        local_resolvers:
          type: array
          items:
            type: string
          description: Array of IP addresses of local DNS serviers that handle local domains
      description: Network resource
    NetworkLookup:
      type: object
      properties:
        block_org_name:
          type: string
          description: Blocked page organization name (may be null)
        block_email_addr:
          type: string
          description: Blocked page email address (may be null)
        block_logo_uuid:
          type: string
          description: Blocked page custom logo (may be null)
        block_default_appearance:
          type: boolean
          description: Default page appearance for blocked pages
      description: Network lookup response
    IpAddressSpec:
      allOf:
      - $ref: '#/components/schemas/IdType'
      - type: object
        properties:
          attributes:
            $ref: '#/components/schemas/IpAddress'
          relationships:
            type: object
            properties:
              network:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IdType'
            description: IP address associated network
      description: IpAddress specification
    NetworkGeo:
      type: object
      properties:
        id:
          type: integer
          description: Network ID
        organization_id:
          type: integer
          description: Organization ID
        name:
          type: string
          description: Network name
        latitude:
          type: number
          format: double
          description: Network reported latitude
        longitude:
          type: number
          format: double
          description: Network reported longitude
        physical_address:
          type: string
          description: Network physical address (may be null)
      description: NetworkGeo resource
    Error:
      type: object
      properties:
        error:
          type: string
          description: 'Error message (e.x.: Not Authorized)'
      description: Error basic representation
    NetworkCounts:
      type: object
      properties:
        all:
          type: integer
        offline:
          type: integer
        protected:
          type: object
          properties:
            count:
              type: integer
            network_ids:
              type: array
              items:
                type: integer
        unprotected:
          type: object
          properties:
            count:
              type: integer
            network_ids:
              type: array
              items:
                type: integer
    NetworkBulkUpdateSpec:
      type: object
      properties:
        ids:
          type: string
          description: Comma delimited Network IDs or keyword 'all'
        organization_id:
          type: integer
          description: Organization ID. Required if ids is 'all'
        policy_id:
          type: integer
          description: Policy ID
        scheduled_policy_id:
          type: integer
          description: Scheduled Policy ID
        block_page_id:
          type: integer
          description: Block Page ID
        is_legacy_vpn_active:
          type: boolean
          description: Is Legacy VPN Active
      required:
      - ids
      description: Network bulk update request parameters
    NetworkUpdate:
      type: object
      properties:
        name:
          type: string
          description: Network name
        organization_id:
          type: integer
          description: Organization resource ID
        block_page_id:
          type: integer
          description: Network custom block page ID
        policy_ids:
          type: array
          items:
            type: integer
          description: Network policy IDs
        external_id:
          type: string
          description: A unique identifier for external integrations
        is_legacy_vpn_active:
          type: boolean
          description: Is Legacy VPN Active
        physical_address:
          type: string
          description: Network physical address
        ip_addresses_attributes:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              address:
                type: string
              key:
                type: string
                format: uuid
          description: IP Address to add/update
        local_domains:
          type: array
          items:
            type: string
          description: Array of local domains or DNS suffixes that should bypass filtering
        local_resolvers:
          type: array
          items:
            type: string
          description: Array of IP addresses of local DNS serviers that handle local domains
      required:
      - name
      - organization_id
      description: Network update request parameters
    NetworkCreateSpec:
      type: object
      properties:
        network:
          $ref: '#/components/schemas/NetworkCreate'
      required:
      - network
      description: Network creation request parameters
    NetworkSpec:
      allOf:
      - $ref: '#/components/schemas/IdType'
      - type: object
        properties:
          attributes:
            $ref: '#/components/schemas/Network'
          relationships:
            type: object
            properties:
              organization:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IdType'
              ip_addresses:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IdType'
              policy:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IdType'
              scheduled_policy:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IdType'
              block_page:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IdType'
              policies:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IdType'
            description: Network associated resources
      description: Network specification
    NetworkUpdateSpec:
      type: object
      properties:
        network:
          $ref: '#/components/schemas/NetworkUpdate'
      required:
      - network
      description: Network update request parameters
    NetworkCreate:
      type: object
      properties:
        name:
          type: string
          description: Network name
        organization_id:
          type: integer
          description: Organization resource ID
        block_page_id:
          type: integer
          description: Network custom block page ID
        policy_ids:
          type: array
          items:
            type: integer
          description: Network policy IDs
        external_id:
          type: string
          description: A unique identifier for external integrations
        is_legacy_vpn_active:
          type: boolean
          description: Is Legacy VPN Active
        physical_address:
          type: string
          description: Network physical address
        ip_addresses_attributes:
          type: array
          items:
            type: object
            properties:
              address:
                type: string
              key:
                type: string
                format: uuid
          description: IP Address to add
        local_domains:
          type: array
          items:
            type: string
          description: Array of local domains or DNS suffixes that should bypass filtering
        local_resolvers:
          type: array
          items:
            type: string
          description: Array of IP addresses of local DNS serviers that handle local domains
      required:
      - name
      - organization_id
      description: Network creation request parameters
    IdType:
      type: object
      properties:
        id:
          type: string
          description: Resource Id (integer or uuid)
        type:
          type: string
          description: Resource type name
        uuid:
          type: string
          description: Resource UUID (if applicable)
      description: JSON API resource ID and type attributes
  securitySchemes:
    header_authorization:
      type: apiKey
      name: Authorization
      in: header
