      operationId: V1_Networks-lookup
      parameters:
      - name: requesting_ip_address
        description: IP address to lookup
        required: true
        in: query
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
