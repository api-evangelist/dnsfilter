openapi: 3.2.0
info:
  title: DNSFilter Networks API
  description: '**Note:** If you are a distributor integrating with DNSFilter, please check

    out our Distributors Development Guide.'
  version: '2026-07-13'
servers:
- url: https://api.dnsfilter.com
  description: Production
tags:
- name: Networks
  description: ''
paths:
  /v1/networks:
    get:
      tags:
      - Networks
      operationId: V1_Networks-index
      parameters:
      - name: basic_info
        description: Return most basic Network Info only. Defaults to False
        required: false
        in: query
        schema:
          type: boolean
      - name: count_network_ips
        description: Return count of IP Addresses. Defaults to False
        required: false
        in: query
        schema:
          type: boolean
      - name: force_truncate_ips
        description: Return Network info without IP Addresses. Defaults to False
        required: false
        in: query
        schema:
          type: boolean
      - name: page
        description: Page number and size
        required: false
        in: query
        schema:
          type: object
          properties:
            number:
              type: integer
            size:
              type: integer
      - name: protected
        description: Filter networks with assigned policy
        required: false
        in: query
        schema:
          type: boolean
      - name: search
        description: Search for the given value among the network name, hostname, ip address, etc.
        required: false
        in: query
        schema:
          type: string
      - name: unprotected
        description: Filter networks without assigned policy
        required: false
        in: query
        schema:
          type: boolean
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Networks basic information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NetworkSpec'
                  included:
                    type: array
                    items:
                      $ref: '#/components/schemas/IpAddressSpec'
                  links:
                    $ref: '#/components/schemas/Links'
      description: Gets user's associated networks with basic information.
      summary: Get extant
      security:
      - header_authorization: []
      x-controller: v1/networks
      x-action: index
    post:
      tags:
      - Networks
      operationId: V1_Networks-create
      parameters: []
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Can not create network with the specified data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '201':
          description: Created network basic information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NetworkSpec'
      description: Creates a new network with the specified data.
      summary: Create
      security:
      - header_authorization: []
      x-controller: v1/networks
      x-action: create
      requestBody:
        description: Network information
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkCreateSpec'
  /v1/networks/all:
    get:
      tags:
      - Networks
      operationId: V1_Networks-all
      parameters:
      - name: basic_info
        description: Return most basic Network Info only. Defaults to False
        required: false
        in: query
        schema:
          type: boolean
      - name: count_network_ips
        description: Return count of IP Addresses. Defaults to False
        required: false
        in: query
        schema:
          type: boolean
      - name: force_truncate_ips
        description: Return Network info without IP Addresses. Defaults to False
        required: false
        in: query
        schema:
          type: boolean
      - name: page
        description: Page number and size
        required: false
        in: query
        schema:
          type: object
          properties:
            number:
              type: integer
            size:
              type: integer
      - name: protected
        description: Filter networks with assigned policy
        required: false
        in: query
        schema:
          type: boolean
      - name: search
        description: Search for the given value among the network name, hostname, ip address, etc.
        required: false
        in: query
        schema:
          type: string
      - name: unprotected
        description: Filter networks without assigned policy
        required: false
        in: query
        schema:
          type: boolean
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Networks basic information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NetworkSpec'
                  included:
                    type: array
                    items:
                      $ref: '#/components/schemas/IpAddressSpec'
                  links:
                    $ref: '#/components/schemas/Links'
      description: Gets ALL networks associated to the user with its basic information.
      summary: Get all
      security:
      - header_authorization: []
      x-controller: v1/networks
      x-action: all
  /v1/networks/counts:
    get:
      tags:
      - Networks
      operationId: V1_Networks-counts
      parameters:
      - name: msp_id
        description: MSP ID, will get info for all suborgs
        required: false
        in: query
        schema:
          type: integer
      - name: organization_ids
        description: Organization IDs, defaults to user organization ID
        required: false
        in: query
        schema:
          type: array
          items:
            type: integer
        explode: true
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Network counts information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkCounts'
      description: Gets counts of networks for each network status.
      summary: Counts
      security:
      - header_authorization: []
      x-controller: v1/networks
      x-action: counts
  /v1/networks/msp:
    get:
