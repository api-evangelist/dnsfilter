          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Can not create secret key
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '200':
          description: Updated network basic information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NetworkSpec'
      description: Rotates (renew) a network secret key to be used by agents.
      summary: Rotate key
