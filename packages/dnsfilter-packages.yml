notes: >-
  DNSFilter publishes no first-party API client SDK on npm, PyPI, RubyGems,
  Maven Central, NuGet, pkg.go.dev, Packagist, or crates.io. The REST API is
  consumed directly over HTTPS with an Authorization header. The only
  first-party published package is @dnsfilter/uikit (a front-end UI component
  library, not an API client). Third-party integrations exist (n8n, Pipedream)
  but are not first-party and are excluded. The archived
  github.com/dnsfilter/webshrinker-sdk-python targets the legacy Web Shrinker
  API, not the DNSFilter management API. No `SDKs` pointer is emitted because
  no official API client library was found.
